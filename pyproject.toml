# zoll is a Rust binary; this file ships it to PyPI as a wheel per platform
# (maturin), so `uv tool install zoll` installs it, and holds the Python
# tools the repository is checked with.
[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "zoll"
description = "Finds code hidden inside other code and data, and judges it by Rego policies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tensorcery" }]
# No Python runs inside: any interpreter that installs a wheel will do.
requires-python = ">=3.10"
# The version is Cargo's: crates/zoll/Cargo.toml takes it from the workspace.
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Tensorcery/zoll"
Repository = "https://github.com/Tensorcery/zoll"
Issues = "https://github.com/Tensorcery/zoll/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/zoll/Cargo.toml"
strip = true

# `uv sync` installs the tools below and never builds the binary itself.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25,<2",
    "commitizen>=4.19.3,<5",
    "pre-commit>=4.6.2,<5",
    "shellcheck-py>=0.11.0.1,<0.12",
    "yamllint>=1.38.0,<2",
    "zizmor>=1.30.1,<2",
]
