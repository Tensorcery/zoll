# zoll is a Rust binary; this file ships it to PyPI as a wheel per platform
# (maturin), so `uv tool install zoll-lint` installs the `zoll` command, and
# holds the Python tools the repository is checked with. The PyPI name is
# zoll-lint: PyPI refuses `zoll` as too similar to the project `zoil`.
[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "zoll-lint"
description = "A policy engine for files of any language: Rego over data, code, and the code embedded in either"
readme = "README.md"
# zoll is MIT; the binary carries Helix's injection queries (MPL-2.0, parts
# nvim-treesitter's, Apache-2.0) and the vendored grammars (MIT,
# BSD-3-Clause, Apache-2.0).
license = "MIT AND MPL-2.0 AND Apache-2.0 AND BSD-3-Clause"
license-files = [
    "LICENSE",
    "queries/LICENSE-*",
    "crates/zoll_grammars/vendor/*/LICENSE",
]
authors = [{ name = "Tensorcery" }]
# No Python runs inside: any interpreter that installs a wheel will do.
requires-python = ">=3.10"
# The version is Cargo's: crates/zoll/Cargo.toml takes it from the workspace.
dynamic = ["version"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Tensorcery/zoll"
Repository = "https://github.com/Tensorcery/zoll"
Issues = "https://github.com/Tensorcery/zoll/issues"

[tool.maturin]
bindings = "bin"
# The injection queries sit beside the crates, not in one: a build from the
# sdist embeds them (crates/zoll_core/build.rs).
include = [{ path = "queries/**/*", format = "sdist" }]
manifest-path = "crates/zoll/Cargo.toml"
strip = true

# `uv sync` installs the tools below and never builds the binary itself.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25,<2",
    "commitizen>=4.19.3,<5",
    "pre-commit>=4.6.2,<5",
    "shellcheck-py>=0.11.0.1,<0.12",
    "yamllint>=1.38.0,<2",
    "zizmor>=1.30.1,<2",
]
