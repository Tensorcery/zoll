[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
# zoll is MIT; the injection queries it embeds are Helix's (MPL-2.0), parts
# of them nvim-treesitter's (Apache-2.0): queries/README.md.
license = "MIT AND MPL-2.0 AND Apache-2.0"
repository = "https://github.com/Tensorcery/zoll"
authors = ["Tensorcery"]

# Versions live here once; a crate names a dependency with `workspace = true`.
[workspace.dependencies]
annotate-snippets = "0.12.18"
anstream = "1.0.0"
anstyle = "1.0.14"
cc = "1.11.2"
clap = { version = "4.6.8", features = ["derive"] }
insta = { version = "1.49.0", features = ["filters"] }
insta-cmd = "0.7.0"
globset = "0.4.21"
ignore = "0.4.34"
# Exact: a policy's meaning is the interpreter's. OPA's builtins without
# json.match_schema (its JSON Schema stack is MIT-0) and without http.send: a
# policy reads the files, not the network.
rayon = "1.12.0"
regex = "1.13.2"
regorus = { version = "=0.15.0", default-features = false, features = [
  "arc",
  "base64",
  "base64url",
  "glob",
  "graph",
  "hex",
  "jsonpatch",
  "net",
  "opa-runtime",
  "regex",
  "semver",
  "std",
  "time",
  "urlquery",
  "uuid",
  "yaml",
] }
saphyr-parser = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
# The runtime and the grammars of the base set (docs/design.md, section 7).
tree-sitter = "0.27.2"
tree-sitter-language = "0.1.9"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.24.0"
tree-sitter-cmake = "0.7.6"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.3.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.3.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-haskell = "0.24.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-ini = "1.4.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-jsonnet = "0.1.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-make = "1.1.1"
tree-sitter-md = "0.5.4"
tree-sitter-nginx = "1.0.1"
tree-sitter-nix = "0.3.0"
tree-sitter-php = "0.25.1"
tree-sitter-powershell = "0.26.6"
tree-sitter-proto = "0.6.1"
tree-sitter-python = "0.25.0"
tree-sitter-regex = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.13"
tree-sitter-sequel = "0.3.13"
tree-sitter-starlark = "1.3.0"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-xml = "0.7.0"
# Always there: YAML is read as data, and its tree is where the injection
# queries find the code in it.
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"
zoll_grammars = { path = "crates/zoll_grammars", default-features = false }

# Every crate takes these with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A failure is a value the caller handles, never a crash.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Output goes through the writer the CLI hands down, so tests can read it.
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
