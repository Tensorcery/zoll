[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Tensorcery/zoll"
authors = ["Tensorcery"]

# Versions live here once; a crate names a dependency with `workspace = true`.
[workspace.dependencies]
annotate-snippets = "0.12.18"
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.8", features = ["derive"] }
insta = { version = "1.49.0", features = ["filters"] }
insta-cmd = "0.7.0"
globset = "0.4.21"
ignore = "0.4.34"
# Exact: a policy's meaning is the interpreter's. OPA's builtins without
# json.match_schema (its JSON Schema stack is MIT-0) and without http.send: a
# policy reads the files, not the network.
rayon = "1.12.0"
regorus = { version = "=0.15.0", default-features = false, features = [
  "arc",
  "base64",
  "base64url",
  "glob",
  "graph",
  "hex",
  "jsonpatch",
  "net",
  "opa-runtime",
  "regex",
  "semver",
  "std",
  "time",
  "urlquery",
  "uuid",
  "yaml",
] }
saphyr-parser = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"

# Every crate takes these with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A failure is a value the caller handles, never a crash.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Output goes through the writer the CLI hands down, so tests can read it.
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
