name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RETRIES: 3

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.100", stable]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Test
        run: |
          cargo test --locked
          echo "done: $(date)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Folded
        if: github.event_name == 'push'
        run: >
          curl -fsSL https://example.com/install.sh
          | sh
