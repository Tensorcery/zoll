x-common: &common
  restart: unless-stopped
  environment:
    TZ: UTC
    DEBUG: "false"

services:
  api:
    <<: *common
    image: example/api:1.0
    ports: ["8080:8080"]
  worker:
    <<: *common
    restart: always
    command: ["python", "-m", "worker"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready || exit 1"]
      interval: 10s
