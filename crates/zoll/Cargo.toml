[package]
name = "zoll"
description = "A policy engine for files of any language: Rego over data, code, and the code embedded in either"
# Not on crates.io: queries/ sits outside the crate. A custom language set
# builds from git (docs/design.md, section 7).
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The languages, as zoll_core names them (docs/design.md, section 7).
default = ["base"]
base = ["zoll_core/base"]
awk = ["zoll_core/awk"]
bash = ["zoll_core/bash"]
c = ["zoll_core/c"]
c_sharp = ["zoll_core/c_sharp"]
cmake = ["zoll_core/cmake"]
cpp = ["zoll_core/cpp"]
css = ["zoll_core/css"]
dart = ["zoll_core/dart"]
dockerfile = ["zoll_core/dockerfile"]
elixir = ["zoll_core/elixir"]
go = ["zoll_core/go"]
gotmpl = ["zoll_core/gotmpl"]
graphql = ["zoll_core/graphql"]
groovy = ["zoll_core/groovy"]
haskell = ["zoll_core/haskell"]
hcl = ["zoll_core/hcl"]
html = ["zoll_core/html"]
ini = ["zoll_core/ini"]
java = ["zoll_core/java"]
javascript = ["zoll_core/javascript"]
jq = ["zoll_core/jq"]
jsonnet = ["zoll_core/jsonnet"]
just = ["zoll_core/just"]
kotlin = ["zoll_core/kotlin"]
lua = ["zoll_core/lua"]
make = ["zoll_core/make"]
markdown = ["zoll_core/markdown"]
nginx = ["zoll_core/nginx"]
nix = ["zoll_core/nix"]
perl = ["zoll_core/perl"]
php = ["zoll_core/php"]
powershell = ["zoll_core/powershell"]
proto = ["zoll_core/proto"]
python = ["zoll_core/python"]
regex = ["zoll_core/regex"]
ruby = ["zoll_core/ruby"]
rust = ["zoll_core/rust"]
scala = ["zoll_core/scala"]
scss = ["zoll_core/scss"]
sql = ["zoll_core/sql"]
starlark = ["zoll_core/starlark"]
svelte = ["zoll_core/svelte"]
swift = ["zoll_core/swift"]
tsx = ["zoll_core/tsx"]
typescript = ["zoll_core/typescript"]
xml = ["zoll_core/xml"]
zig = ["zoll_core/zig"]

[dependencies]
annotate-snippets.workspace = true
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
rayon.workspace = true
serde_json.workspace = true
zoll_core.workspace = true

[lints]
workspace = true

[dev-dependencies]
insta.workspace = true
insta-cmd.workspace = true
tempfile.workspace = true
