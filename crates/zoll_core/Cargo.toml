tree-sitter-yaml.workspace = true
zoll_grammars = { workspace = true, optional = true }

# `make queries`: Helix's injection queries into `queries/`. Its tests run
# with the crate's.
[[example]]
name = "sync_queries"
test = true

[lints]
workspace = true
