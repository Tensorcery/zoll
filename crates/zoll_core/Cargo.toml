[package]
name = "zoll_core"
description = "The engine of zoll: languages, parsing, embedded fragments, policy evaluation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# The base set of docs/design.md, section 7. A language is a feature of its
# name; YAML, JSON and TOML are read as data and are always there.
default = ["base"]
base = [
  "awk",
  "bash",
  "c",
  "c_sharp",
  "cmake",
  "cpp",
  "css",
  "dart",
  "dockerfile",
  "elixir",
  "go",
  "gotmpl",
  "graphql",
  "groovy",
  "haskell",
  "hcl",
  "html",
  "ini",
  "java",
  "javascript",
  "jq",
  "jsonnet",
  "just",
  "kotlin",
  "lua",
  "make",
  "markdown",
  "nginx",
  "nix",
  "perl",
  "php",
  "powershell",
  "proto",
  "python",
  "regex",
  "ruby",
  "rust",
  "scala",
  "scss",
  "sql",
  "starlark",
  "svelte",
  "swift",
  "tsx",
  "typescript",
  "xml",
  "zig",
]
awk = ["dep:zoll_grammars", "zoll_grammars/awk"]
bash = ["dep:tree-sitter-bash"]
c = ["dep:tree-sitter-c"]
c_sharp = ["dep:tree-sitter-c-sharp"]
cmake = ["dep:tree-sitter-cmake"]
cpp = ["dep:tree-sitter-cpp"]
css = ["dep:tree-sitter-css"]
dart = ["dep:tree-sitter-dart"]
dockerfile = ["dep:tree-sitter-containerfile"]
elixir = ["dep:tree-sitter-elixir"]
go = ["dep:tree-sitter-go"]
gotmpl = ["dep:zoll_grammars", "zoll_grammars/gotmpl"]
graphql = ["dep:tree-sitter-graphql"]
groovy = ["dep:tree-sitter-groovy"]
haskell = ["dep:tree-sitter-haskell"]
hcl = ["dep:tree-sitter-hcl"]
html = ["dep:tree-sitter-html"]
ini = ["dep:tree-sitter-ini"]
java = ["dep:tree-sitter-java"]
javascript = ["dep:tree-sitter-javascript"]
jq = ["dep:zoll_grammars", "zoll_grammars/jq"]
jsonnet = ["dep:tree-sitter-jsonnet"]
just = ["dep:zoll_grammars", "zoll_grammars/just"]
kotlin = ["dep:tree-sitter-kotlin-ng"]
lua = ["dep:tree-sitter-lua"]
make = ["dep:tree-sitter-make"]
markdown = ["dep:tree-sitter-md"]
nginx = ["dep:tree-sitter-nginx"]
nix = ["dep:tree-sitter-nix"]
perl = ["dep:zoll_grammars", "zoll_grammars/perl"]
php = ["dep:tree-sitter-php"]
powershell = ["dep:tree-sitter-powershell"]
proto = ["dep:tree-sitter-proto"]
python = ["dep:tree-sitter-python"]
regex = ["dep:tree-sitter-regex"]
ruby = ["dep:tree-sitter-ruby"]
rust = ["dep:tree-sitter-rust"]
scala = ["dep:tree-sitter-scala"]
scss = ["dep:zoll_grammars", "zoll_grammars/scss"]
sql = ["dep:tree-sitter-sequel"]
starlark = ["dep:tree-sitter-starlark"]
svelte = ["dep:tree-sitter-svelte-ng"]
swift = ["dep:tree-sitter-swift"]
tsx = ["dep:tree-sitter-typescript"]
typescript = ["dep:tree-sitter-typescript"]
xml = ["dep:tree-sitter-xml"]
zig = ["dep:tree-sitter-zig"]

