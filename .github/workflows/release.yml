# On main: when the version in Cargo.toml has no tag yet, this builds a
# wheel per platform and the sdist, tries each wheel on its own system,
# publishes them to PyPI and makes the tag and the GitHub release. Every
# other push to main finds the tag and does nothing.
name: release

on:
  push:
    branches: [main]

permissions: {}

# Two pushes in a row must not both find the tag missing; a release is
# never cut short halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: is the version released
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false
      - id: version
        run: .github/scripts/version.sh

  wheel:
    name: wheel (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # Each built natively, so each is tried where it was built.
        include:
          - {os: ubuntu-24.04, target: x86_64, manylinux: auto}
          - {os: ubuntu-24.04-arm, target: aarch64, manylinux: auto}
          - {os: macos-15-intel, target: x86_64}
          - {os: macos-15, target: aarch64}
          - {os: windows-2025, target: x64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # What is published takes nothing from a cache.
          enable-cache: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: build
          args: --release --locked --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      # Windows runners have no make: the script `make smoke` runs.
      - run: bash scripts/smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false
      - run: uv build --sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish and release
    needs: [version, wheel, sdist]
    runs-on: ubuntu-24.04
    # PyPI's Trusted Publishing trusts this workflow in this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/zoll-lint/
    permissions:
      contents: write  # creates the tag and the release
      id-token: write  # PyPI's Trusted Publishing
      pull-requests: read  # the description is the merged release pull request's
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: .github/scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
