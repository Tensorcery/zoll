# Started by hand. Opens the pull request that raises the version; merging
# that pull request is the release (release.yml).
name: prepare release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: auto takes it from the commits since the last tag
        type: choice
        options: [auto, PATCH, MINOR, MAJOR]
        default: auto

permissions: {}

jobs:
  prepare:
    name: open the release pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # pushes the branch release/v<next>
      pull-requests: write  # opens its pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # A job that may write to the repository takes nothing from a cache.
          enable-cache: false
      - run: .github/scripts/prepare-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          INCREMENT: ${{ inputs.increment }}
          BASE: ${{ github.event.repository.default_branch }}
